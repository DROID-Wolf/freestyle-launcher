<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freestyle Launcher</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="screen" id="screen" data-t="evening">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="grain"></div>

  <div class="top">
    <div class="greet"><span id="greet">Hello</span><span id="nameWrap" hidden>, <b id="name"></b></span></div>
    <div class="pills">
      <div class="pill iconly" id="editBtn" data-top="0"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg><span class="tip2">Customize</span></div>
      <div class="pill act" id="wifiBtn" data-top="1"><svg viewBox="0 0 24 24"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/></svg>Wi-Fi</div>
      <div class="pill act" id="settingsBtn" data-top="2"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>Settings</div>
    </div>
  </div>

  <div class="clock">
    <div class="t"><span id="hh"></span><span class="colon">:</span><span id="mm"></span><span class="ampm" id="ap"></span></div>
    <div class="d" id="date"></div>
    <div class="dayline"><div class="bar"><div class="fill" id="fill"></div></div>
      <div class="lbls"><span id="rise"></span><span id="daypct"></span><span id="set"></span></div></div>
  </div>

  <div class="wx" id="wx" hidden>
    <div class="row">
      <div class="sun" id="sun"><div class="rays" id="rays"></div><div class="core"></div><div class="cloud"></div><div class="drops" id="drops"></div></div>
      <div><div class="deg" id="deg"></div><div class="cond" id="cond"></div><div class="hl" id="hl"></div></div>
    </div>
    <div class="hours" id="hours"></div>
  </div>

  <div class="dock" id="dock"></div>

  <div class="quote" id="quote" hidden><b id="quoteLbl"></b><span id="quoteTxt"></span></div>

  <div class="toast" id="toast"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
