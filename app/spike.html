<!doctype html>
<!-- TEMPORARY (themes plan, Task 1): on-device video playback test. Removed after the test. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video test</title>
<style>
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; color:#fff; font:28px/1.4 system-ui, sans-serif; }
  #a { position:absolute; left:0; top:0; width:100%; height:100%; object-fit:cover; }
  #b { position:absolute; right:3%; bottom:6%; width:46%; height:46%; object-fit:cover; border:3px solid #fff; display:none; }
  #info { position:absolute; left:3%; top:4%; padding:18px 24px; background:rgba(0,0,0,.75); border:3px solid #ff0; border-radius:14px; white-space:pre; }
</style>
</head>
<body>
<video id="a" muted loop autoplay playsinline preload="auto"></video>
<video id="b" muted loop autoplay playsinline preload="auto"></video>
<div id="info">VIDEO TEST - starting...</div>
<script type="module">
  import { mediaUrl } from './js/media.js';
  const src = mediaUrl('media/video/city-rain.mp4', location.pathname);
  const a = document.getElementById('a');
  const b = document.getElementById('b');
  const info = document.getElementById('info');
  const t0 = Date.now();
  a.src = src;
  setTimeout(() => { b.src = src; b.style.display = 'block'; }, 20000);
  const q = (v) => {
    if (!v.src) return 'off';
    if (v.error) return 'ERROR ' + v.error.code;
    const p = v.getVideoPlaybackQuality ? v.getVideoPlaybackQuality() : null;
    return (v.paused ? 'paused' : 'playing') + (p ? `  frames ${p.totalVideoFrames}  dropped ${p.droppedVideoFrames}` : '');
  };
  setInterval(() => {
    const s = Math.round((Date.now() - t0) / 1000);
    info.textContent = `VIDEO TEST  ${s}s  (second video starts at 20s)\n` +
      `Video 1: ${q(a)}\nVideo 2: ${q(b)}\nPress Enter to go back to the launcher`;
  }, 2000);
  const back = () => location.replace('index.html?nospike');
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter') back(); });
</script>
</body>
</html>
